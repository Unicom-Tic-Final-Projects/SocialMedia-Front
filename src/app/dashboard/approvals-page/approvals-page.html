<div class="min-h-screen bg-[#FFFFFF] text-[#222222]">
  <!-- Header Section -->
  <div class="mb-8 md:mb-12">
    <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-[#1A1A1A] mb-2 flex items-center gap-3">
      <i class="fa-solid fa-check-circle text-[#4C6FFF]"></i> Approvals
    </h1>
    <p class="text-gray-600 text-sm sm:text-base">Review and approve pending post requests</p>
  </div>
  <div class="flex justify-between items-center mb-6">
    <div class="relative w-80">
      <i
        class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500"
      ></i>
      <input
        type="text"
        placeholder="Search post..."
        class="bg-white border border-[#E5E7EB] rounded-xl pl-12 pr-4 py-3 w-full focus:outline-none focus:ring-2 focus:ring-[#4C6FFF]/10 focus:border-[#4C6FFF] text-[#1A1A1A] transition-all duration-200"
      />
    </div>
  </div>

  <div class="bg-white rounded-xl overflow-hidden border border-[#E5E7EB]">
    <div class="overflow-x-auto">
      <table class="min-w-full">
        <thead class="bg-[#F5F7FF]">
          <tr>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-[#1A1A1A]">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-heading"></i> Post Title
              </div>
            </th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-[#1A1A1A]">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-user"></i> Requested By
              </div>
            </th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-[#1A1A1A]">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-info"></i> Status
              </div>
            </th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-[#1A1A1A]">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-calendar"></i> Requested Date
              </div>
            </th>
            <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-[#1A1A1A]">
              <div class="flex items-center gap-2"><i class="fa-solid fa-gear"></i> Actions</div>
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#E5E7EB]">
          <tr class="hover:bg-[#F5F7FF] transition-all duration-200">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-semibold text-[#1A1A1A]">Black Friday Offer</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-[#1A1A1A]">John (Designer)</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span
                class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-yellow-50 text-yellow-700 border border-yellow-200"
                >Pending</span
              >
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">Nov 5, 2025</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex gap-2">
                <button
                  type="button"
                  class="bg-green-50 text-green-700 border border-green-200 px-4 py-2 rounded-xl hover:bg-green-100 transition-all duration-200 font-medium text-sm flex items-center gap-2"
                >
                  <i class="fa-solid fa-check"></i> Approve
                </button>
                <button
                  type="button"
                  class="bg-red-50 text-red-700 border border-red-200 px-4 py-2 rounded-xl hover:bg-red-100 transition-all duration-200 font-medium text-sm flex items-center gap-2"
                >
                  <i class="fa-solid fa-xmark"></i> Reject
                </button>
              </div>
            </td>
          </tr>

          <tr class="hover:bg-[#F5F7FF] transition-all duration-200">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-semibold text-[#1A1A1A]">Holiday Giveaway</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-[#1A1A1A]">Sara (Content)</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span
                class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-yellow-500/20 text-yellow-300 border border-yellow-500/30"
                >Pending</span
              >
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">Nov 3, 2025</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex gap-2">
                <button
                  type="button"
                  class="bg-green-500/20 text-green-300 border border-green-500/30 px-4 py-2 rounded-lg hover:bg-green-500/30 transition-all duration-200 font-semibold text-sm flex items-center gap-2 shadow-md hover:shadow-lg"
                >
                  <i class="fa-solid fa-check"></i> Approve
                </button>
                <button
                  type="button"
                  class="bg-red-500/20 text-red-300 border border-red-500/30 px-4 py-2 rounded-lg hover:bg-red-500/30 transition-all duration-200 font-semibold text-sm flex items-center gap-2 shadow-md hover:shadow-lg"
                >
                  <i class="fa-solid fa-xmark"></i> Reject
                </button>
              </div>
            </td>
          </tr>

          <tr class="hover:bg-[#F5F7FF] transition-all duration-200">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-semibold text-[#1A1A1A]">New Year Promo</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-[#1A1A1A]">Mike (Social Lead)</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span
                class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-yellow-500/20 text-yellow-300 border border-yellow-500/30"
                >Pending</span
              >
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">Nov 2, 2025</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex gap-2">
                <button
                  type="button"
                  class="bg-green-500/20 text-green-300 border border-green-500/30 px-4 py-2 rounded-lg hover:bg-green-500/30 transition-all duration-200 font-semibold text-sm flex items-center gap-2 shadow-md hover:shadow-lg"
                >
                  <i class="fa-solid fa-check"></i> Approve
                </button>
                <button
                  type="button"
                  class="bg-red-500/20 text-red-300 border border-red-500/30 px-4 py-2 rounded-lg hover:bg-red-500/30 transition-all duration-200 font-semibold text-sm flex items-center gap-2 shadow-md hover:shadow-lg"
                >
                  <i class="fa-solid fa-xmark"></i> Reject
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
