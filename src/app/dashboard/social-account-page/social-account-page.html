<div class="min-h-screen bg-[#FFFFFF] text-[#1A1A1A]">
  @if (showGrid) {
    <div class="animate-fadeIn">
      <div class="mb-8 animate-slideDown">
        <h1 class="text-3xl font-bold text-[#1A1A1A] mb-2 flex items-center gap-3">
          <i class="fa-solid fa-link text-[#4C6FFF] animate-pulse"></i> Social Accounts
          <!-- Loading indicator -->
          @if (socialAccountsService.loading()) {
            <i class="fa-solid fa-circle-notch animate-spin text-[#4C6FFF] text-sm"></i>
          }
        </h1>
        <p class="text-gray-600 text-sm">
          Connect your favorite social media platforms to schedule, publish, and manage posts
          directly from Onevo.
        </p>
      </div>

      <!-- Social Media Grid -->
      <app-social-account-list
        [platforms]="platforms"
        [profileImageErrors]="profileImageErrors"
        (disconnect)="onDisconnect($event)"
        (profileImageErrorChange)="onProfileImageError($event)"
      />
    </div>
  }

  <!-- Manual Connect Modal -->
  <app-manual-connect-modal
    [isOpen]="manualConnectModalOpen"
    [platform]="manualConnectPlatform"
    [loading]="manualConnectLoading"
    [error]="manualConnectError"
    (close)="closeManualConnectModal()"
    (submit)="submitManualConnect($event)"
  />
</div>
