<div class="min-h-screen bg-[#FFFFFF] text-[#222222]">
  <!-- Header Section -->
  <div class="mb-8 md:mb-12">
    <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-[#1A1A1A] mb-2 flex items-center gap-3">
      <i class="fa-solid fa-folder-open text-[#4C6FFF]"></i> Media Library
    </h2>
    <p class="text-gray-600 text-sm sm:text-base">Manage your media files and assets</p>
  </div>

  <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
    <!-- Search -->
    <div class="relative w-72">
      <i
        class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"
      ></i>
      <input
        type="text"
        placeholder="Search media..."
        class="bg-white border border-[#E5E7EB] rounded-xl pl-10 pr-4 py-3 w-full text-[#222222] focus:outline-none focus:ring-2 focus:ring-[#4C6FFF]/10 focus:border-[#4C6FFF] transition-all duration-200"
      />
    </div>

    <!-- Upload -->
    <button
      type="button"
      class="bg-[#4C6FFF] text-white font-medium px-6 py-3 rounded-xl hover:bg-[#3A56CC] transition-all duration-200 flex items-center gap-2"
    >
      <i class="fa-solid fa-upload"></i> Upload Media
    </button>
  </div>

  <!-- Library Grid -->
  <div class="bg-white rounded-xl p-6 border border-[#E5E7EB]">
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
      <!-- Item 1 -->
      <div
        class="bg-[#F9FAFB] rounded-xl p-4 aspect-square flex items-center justify-center border border-[#E5E7EB] hover:bg-[#F5F7FF] hover:border-[#4C6FFF]/30 transition-all duration-200 cursor-pointer"
      >
        <div class="text-center">
          <i class="fa-solid fa-image text-4xl text-gray-400 mb-2"></i>
          <p class="text-sm text-gray-600">Image Placeholder</p>
        </div>
      </div>

      <!-- Item 2 -->
      <div
        class="bg-[#F9FAFB] rounded-xl p-4 aspect-square flex items-center justify-center border border-[#E5E7EB] hover:bg-[#F5F7FF] hover:border-[#4C6FFF]/30 transition-all duration-200 cursor-pointer"
      >
        <div class="text-center">
          <i class="fa-solid fa-video text-4xl text-gray-400 mb-2"></i>
          <p class="text-sm text-gray-600">Video Placeholder</p>
        </div>
      </div>
    </div>
  </div>
</div>
