<div class="video-editor-container space-y-4">
  <!-- Video Player -->
  <div class="bg-black rounded-lg overflow-hidden">
    <video
      #videoPlayer
      [src]="previewUrl() || videoUrl"
      controls
      class="w-full max-h-[400px]"
      (loadedmetadata)="onVideoLoaded()"
      (timeupdate)="onTimeUpdate()"
    ></video>
  </div>

  <!-- Timeline Controls -->
  <div class="space-y-2">
    <div class="flex items-center justify-between text-sm text-gray-600">
      <span>Start: {{ formatTime(startTime()) }}</span>
      <span>End: {{ formatTime(endTime()) }}</span>
      <span>Duration: {{ formatTime(duration()) }}</span>
    </div>

    <div class="space-y-2">
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Start Time</label>
        <div class="flex gap-2">
          <input
            type="range"
            [min]="0"
            [max]="duration()"
            [step]="0.1"
            [(ngModel)]="startTime"
            class="flex-1"
          />
          <button
            type="button"
            (click)="setStartTime()"
            class="px-3 py-1 text-xs bg-blue-500 text-white rounded hover:bg-blue-600"
          >
            Set
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">End Time</label>
        <div class="flex gap-2">
          <input
            type="range"
            [min]="0"
            [max]="duration()"
            [step]="0.1"
            [(ngModel)]="endTime"
            class="flex-1"
          />
          <button
            type="button"
            (click)="setEndTime()"
            class="px-3 py-1 text-xs bg-blue-500 text-white rounded hover:bg-blue-600"
          >
            Set
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="space-y-3 border-t pt-4">
    <h3 class="text-sm font-semibold text-gray-800">Adjustments</h3>

    <div>
      <label class="block text-xs font-medium text-gray-700 mb-1">
        Brightness: {{ brightness() }}%
      </label>
      <input
        type="range"
        [min]="0"
        [max]="200"
        [(ngModel)]="brightness"
        class="w-full"
      />
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-700 mb-1">
        Contrast: {{ contrast() }}%
      </label>
      <input
        type="range"
        [min]="0"
        [max]="200"
        [(ngModel)]="contrast"
        class="w-full"
      />
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-700 mb-1">
        Saturation: {{ saturation() }}%
      </label>
      <input
        type="range"
        [min]="0"
        [max]="200"
        [(ngModel)]="saturation"
        class="w-full"
      />
    </div>
  </div>

  <!-- Actions -->
  <div class="flex gap-2 pt-4 border-t">
    <button
      type="button"
      (click)="reset()"
      class="flex-1 px-4 py-2 text-sm bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300"
      [disabled]="processing()"
    >
      Reset
    </button>
    <button
      type="button"
      (click)="applyEdits()"
      class="flex-1 px-4 py-2 text-sm bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:opacity-50"
      [disabled]="processing()"
    >
      @if (processing()) {
        Processing...
      } @else {
        Apply Edits
      }
    </button>
  </div>
</div>
